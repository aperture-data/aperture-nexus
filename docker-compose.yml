# aperture-nexus + ApertureDB — local development stack
#
# Starts ApertureDB community edition, the Lenz TCP gateway, and the
# ApertureDB Web UI so you can inspect your data through a browser.
#
# IMPORTANT: The ApertureDB community edition image is licensed for
# evaluation and development only — no production or commercial use.
# See: https://www.aperturedata.io/docker-license
# For production licensing: https://www.aperturedata.io/contact-us
#
# After startup:
#   http://localhost:8087  — ApertureDB Web UI (entities, connections,
#                            descriptors, images — inspect stored memories)
#
# Usage:
#   docker compose up -d
#   docker compose down          # stop (data preserved)
#   docker compose down -v       # stop and delete all data
#
# Override host ports without editing this file:
#   APERTUREDB_PORT=12345 WEBUI_PORT=9090 docker compose up -d
#
# The ApertureDB TCP endpoint used by the adb CLI and aperture-nexus is
# exposed through Lenz (the TCP gateway), not directly. Configure your
# adb client to point at localhost:${APERTUREDB_PORT:-55556}.
#
# Mac note: port 55555 is reserved by macOS. This stack exposes 55556
# for lenz and 8087 for the web UI — neither conflicts with that.

name: aperture-nexus-local

services:

  aperturedb:
    image: aperturedata/aperturedb-community:latest
    restart: unless-stopped
    # No direct host port — access is through lenz (TCP) or nginx (HTTP).
    environment:
      ADB_MASTER_KEY: "${APERTUREDB_PASSWORD:-admin}"
      ADB_FORCE_SSL: "false"
    volumes:
      # Persist ApertureDB data between restarts.
      # Remove this volume to start fresh: docker compose down -v
      - aperturedb_data:/aperturedb/db
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/55555'"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s

  lenz:
    image: aperturedata/lenz:latest
    depends_on:
      aperturedb:
        condition: service_healthy
    restart: unless-stopped
    ports:
      # TCP endpoint for the adb CLI and aperture-nexus SDK.
      # Change APERTUREDB_PORT env var to use a different host port.
      - "${APERTUREDB_PORT:-55556}:55551"
    environment:
      LNZ_TCP_PORT: 55551
      LNZ_HTTP_PORT: 8080
      # ApertureDB always listens on 55555 internally.
      LNZ_ADB_BACKENDS: '["aperturedb:55555"]'
      LNZ_REPLICAS: 1
      LNZ_ADB_MAX_CONCURRENCY: 48
      LNZ_FORCE_SSL: "false"

  webui:
    image: aperturedata/aperturedata-platform-web-private:latest
    restart: unless-stopped
    depends_on:
      - lenz

  nginx:
    image: nginx
    restart: unless-stopped
    depends_on:
      - webui
      - lenz
    ports:
      # ApertureDB Web UI — change WEBUI_PORT to use a different host port.
      - "${WEBUI_PORT:-8087}:80"
    configs:
      - source: nginx.conf
        target: /etc/nginx/conf.d/default.conf

  # ── aperture-nexus demo ───────────────────────────────────────────────────
  #
  # Runs a self-contained walkthrough that captures context across two
  # sessions and retrieves it — no setup, no credentials, no embedding models.
  #
  # Interactive (pauses at each step — recommended):
  #   docker compose --profile demo run --rm nexus-demo
  #
  # Unattended (streams output without pausing):
  #   docker compose --profile demo up
  #
  # For regular development (ApertureDB stack only):
  #   docker compose up -d
  #
  nexus-demo:
    profiles: ["demo"]
    build:
      context: .
      dockerfile: demo/Dockerfile.demo
    depends_on:
      aperturedb:
        condition: service_healthy
      lenz:
        condition: service_started
      webui:
        condition: service_started
      nginx:
        condition: service_started
    stdin_open: true
    tty: true
    environment:
      # Connect through lenz (the TCP gateway) — same path as the adb CLI.
      APERTUREDB_JSON: '{"host":"lenz","port":55551,"username":"admin","password":"${APERTUREDB_PASSWORD:-admin}","use_ssl":false}'
      APERTURE_NEXUS_LOG_LEVEL: "WARNING"
      PYTHONUNBUFFERED: "1"
    restart: "no"

configs:
  nginx.conf:
    content: |
      server {
        listen 80;
        client_max_body_size 256m;
        location / {
          proxy_pass http://webui;
        }
        location /api/ {
          proxy_pass http://lenz:8080;
        }
      }

volumes:
  aperturedb_data:
    driver: local
