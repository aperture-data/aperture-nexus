# aperture-nexus + ApertureDB — local development stack
#
# Starts ApertureDB from its published Docker Compose package
# (aperturedata/aperturedb-compose-single-node): the database, the Lenz TCP
# gateway, and the ApertureDB Web UI so you can inspect your data through a
# browser. APERTUREDB_VERSION selects a release; the default is the latest.
#
# See https://www.aperturedata.io/docker-license for the image license, and
# https://www.aperturedata.io/contact-us for production licensing.
#
# After startup:
#   https://localhost:8443 — ApertureDB Web UI (entities, connections,
#                            descriptors, images — inspect stored memories).
#                            http://localhost:8087 redirects there; the
#                            certificate is self-signed.
#
# Usage:
#   docker compose up -d
#   docker compose down          # stop (data preserved)
#   docker compose down -v       # stop and delete all data
#
# Override host ports without editing this file:
#   APERTUREDB_PORT=12345 WEBUI_PORT=9090 WEBUI_HTTPS_PORT=9443 docker compose up -d
#
# The ApertureDB TCP endpoint used by the adb CLI and aperture-nexus is
# exposed through Lenz (the TCP gateway), not directly. Configure your
# adb client to point at localhost:${APERTUREDB_PORT:-55556}.
#
# Mac note: port 55555 is reserved by macOS. This stack exposes 55556
# for lenz and 8087/8443 for the web UI — none conflicts with that.

name: aperture-nexus-local

include:
  - path:
      - oci://aperturedata/aperturedb-compose-single-node:${APERTUREDB_VERSION:-latest}
      - aperturedb.compose.yml
    # Resolve aperturedb.compose.yml's relative paths from this directory.
    project_directory: .
    env_file: aperturedb.env

services:

  # ── aperture-nexus demo ───────────────────────────────────────────────────
  #
  # Runs a self-contained walkthrough that captures context across two
  # sessions and retrieves it — no setup, no credentials, no embedding models.
  #
  # Interactive (pauses at each step — recommended):
  #   docker compose --profile demo run --rm nexus-demo
  #
  # Unattended (streams output without pausing):
  #   docker compose --profile demo up
  #
  # For regular development (ApertureDB stack only):
  #   docker compose up -d
  #
  nexus-demo:
    profiles: ["demo"]
    build:
      context: .
      dockerfile: demo/Dockerfile.demo
    depends_on:
      aperturedb:
        condition: service_healthy
      lenz:
        condition: service_healthy
      http-proxy:
        condition: service_started
    stdin_open: true
    tty: true
    environment:
      # Connect through lenz (the TCP gateway) — same path as the adb CLI.
      APERTUREDB_JSON: '{"host":"lenz","port":55551,"username":"admin","password":"${APERTUREDB_PASSWORD:-admin}","use_ssl":false}'
      APERTURE_NEXUS_LOG_LEVEL: "WARNING"
      PYTHONUNBUFFERED: "1"
    restart: "no"
