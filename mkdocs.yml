site_name: aperture-nexus
site_description: The Cognition Engine for Enterprise AI — context, knowledge, and memory for AI workflows, agents, and teams
site_url: https://aperture-data.github.io/aperture-nexus
repo_url: https://github.com/aperture-data/aperture-nexus
repo_name: aperture-data/aperture-nexus
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy
    - content.action.edit

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: README.md
  - Concepts: concepts.md
  - Getting Started: getting-started.md
  - API Reference: api-reference.md
  - Configuration: configuration.md
  - Customer Support Agent: customer-support-agent.md
