[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aperture-nexus"
version = "0.1.0"
description = "The cognition engine for enterprise AI — establish context, capture multimodal knowledge, and commit to memory for retrieval."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "ApertureData Inc.", email = "support@aperturedata.io" }
]
keywords = ["memory", "cognition", "multimodal", "aperturedb", "vector-search", "knowledge-graph", "ai", "agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Database",
]

# Core dependencies — kept minimal intentionally.
# Install extras for additional capabilities: pip install aperture-nexus[video,metrics,ui,clip]
dependencies = [
    "aperturedb>=0.4.55",
    "numpy>=1.24",
    "pillow>=10.0",          # PIL image handling
    "pydantic>=2.0",         # config validation and data models
    "python-dotenv>=1.0",    # .env file support for credentials
    "requests>=2.31",        # URL fetching for image/video inputs
]

[project.optional-dependencies]
# Video frame extraction for CLIP embedding
video = [
    "opencv-python>=4.9",
]

# Token-based text chunking
tokens = [
    "tiktoken>=0.7",
]

# Prometheus metrics export
metrics = [
    "prometheus-client>=0.20",
]

# Web UI and REST API
ui = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

# CLIP embeddings (text, image, video)
clip = [
    "open-clip-torch>=2.24",
]

# Integration test dependencies (spins up local ApertureDB via Docker)
integration = [
    "testcontainers>=4.4",
    "docker>=7.0",
]

# Development dependencies
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "httpx>=0.27",           # for testing FastAPI routes
    "autopep8>=2.0",
    "pre-commit>=3.0",
    "mypy>=1.10",
    "testcontainers>=4.4",
    "docker>=7.0",
]

# Install everything
all = [
    "aperture-nexus[video,tokens,metrics,ui,clip]",
]

[project.scripts]
adb-nexus = "aperture_nexus.cli:app"

[project.urls]
Homepage = "https://github.com/aperture-data/aperture-nexus"
Documentation = "https://docs.aperturedata.dev/aperture-nexus"
Repository = "https://github.com/aperture-data/aperture-nexus"
Issues = "https://github.com/aperture-data/aperture-nexus/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: requires a live ApertureDB instance (skipped automatically if unavailable)",
    "slow: takes more than a few seconds — omit with -m 'not slow' for fast feedback",
]

# ---------------------------------------------------------------------------
# Test selection quick reference
#
#   pytest                              # all tests (integration skips if no DB)
#   pytest -m "not integration"         # unit tests only
#   pytest -m integration               # integration tests only
#   pytest -m "not slow"                # skip slow tests
#   pytest tests/test_client.py         # one module
#   pytest tests/test_client.py::TestValidateConnection   # one class
#   pytest -k "raises"                  # tests whose name contains "raises"
#   pytest --co -q                      # list all tests without running them
#   pytest --cov=aperture_nexus         # with coverage
# ---------------------------------------------------------------------------

[tool.coverage.run]
source = ["aperture_nexus"]
omit = ["tests/*"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[tool.autopep8]
max_line_length = 80

[tool.pycodestyle]
max_line_length = 80
